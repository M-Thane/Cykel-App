name: Register Strava webhook subscription

# One-off, manual: registers this app's Strava push-subscription webhook.
# Run once after the Worker is deployed and reachable. Re-running after a
# subscription already exists will just report that (Strava allows only one
# active subscription per API app).

on:
  workflow_dispatch:
    inputs:
      callback_url:
        description: 'Full webhook URL, e.g. https://cykel-app-api.mtandesen.workers.dev/webhooks/strava'
        required: true

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Create subscription
        env:
          STRAVA_CLIENT_ID: '145080'
          STRAVA_CLIENT_SECRET: ${{ secrets.WORKER_STRAVA_CLIENT_SECRET }}
          STRAVA_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WORKER_STRAVA_WEBHOOK_VERIFY_TOKEN }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          curl -sS -X POST https://www.strava.com/api/v3/push_subscriptions \
            -F client_id="$STRAVA_CLIENT_ID" \
            -F client_secret="$STRAVA_CLIENT_SECRET" \
            -F callback_url="$CALLBACK_URL" \
            -F verify_token="$STRAVA_WEBHOOK_VERIFY_TOKEN" | tee response.json
          echo "---"
          if grep -q '"id"' response.json; then
            echo "Subscription created."
          else
            echo "Did not see a subscription id in the response -- check the output above."
          fi
